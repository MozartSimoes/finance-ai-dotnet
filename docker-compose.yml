# Local development only: credentials below are not secrets.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: financeai
      POSTGRES_USER: financeai
      POSTGRES_PASSWORD: financeai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeai"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=financeai;Username=financeai;Password=financeai"
    ports:
      - "8080:8080"
